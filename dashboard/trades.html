<style>
:root{--black:#020305;--dark:#080b0f;--panel:#0c1018;--border:#141b26;--border2:#1e2a3a;--green:#00ff88;--green2:#00cc6a;--red:#ff3366;--gold:#f0b429;--blue:#0ea5e9;--text:#c8d4e0;--text-dim:#5a6a7a;--text-bright:#eef2f7;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--black);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,136,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,0.015) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}
.sidebar{width:220px;background:var(--dark);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:10;}
.sidebar-logo{padding:24px 20px;border-bottom:1px solid var(--border);font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--text-bright);}
.sidebar-logo span{color:var(--green);}
.sidebar-nav{flex:1;padding:20px 12px;display:flex;flex-direction:column;gap:4px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;color:var(--text-dim);font-size:0.82rem;font-weight:500;text-decoration:none;transition:all 0.2s;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-item.active{background:rgba(0,255,136,0.08);color:var(--green);border:1px solid rgba(0,255,136,0.1);}
.sidebar-bottom{padding:16px 12px;border-top:1px solid var(--border);}
.user-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid var(--border);}
.user-avatar{width:32px;height:32px;border-radius:6px;background:rgba(0,255,136,0.15);border:1px solid rgba(0,255,136,0.2);display:flex;align-items:center;justify-content:center;}
.user-name{font-size:0.78rem;font-weight:600;color:var(--text-bright);}
.user-plan{font-size:0.6rem;color:var(--green);}
.main{flex:1;margin-left:220px;position:relative;z-index:1;}
.topbar{height:60px;background:rgba(2,3,5,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:9;}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;color:var(--text-bright);}
.topbar-btn{background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);color:var(--green);padding:7px 16px;border-radius:4px;font-size:0.72rem;cursor:pointer;font-family:'DM Sans',sans-serif;}
.content{padding:28px;}

/* SUMMARY CARDS */
.summary-row{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px;}
.sum-card{background:var(--panel);border:1px solid var(--border2);border-radius:8px;padding:16px;text-align:center;}
.sum-label{font-size:0.6rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);margin-bottom:6px;}
.sum-value{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:2px;}

/* FILTER */
.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
.filter-btn{padding:7px 14px;border-radius:6px;font-size:0.72rem;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text-dim);transition:all 0.2s;}
.filter-btn:hover,.filter-btn.active{border-color:var(--green);color:var(--green);background:rgba(0,255,136,0.06);}
.filter-spacer{flex:1;}
.export-btn{padding:7px 14px;border-radius:6px;font-size:0.72rem;background:rgba(255,255,255,0.04);border:1px solid var(--border2);color:var(--text-dim);cursor:pointer;transition:all 0.2s;}
.export-btn:hover{border-color:var(--green);color:var(--green);}

/* TABLE */
.trades-table{background:var(--panel);border:1px solid var(--border2);border-radius:10px;overflow:hidden;}
.table-header{display:grid;grid-template-columns:120px 100px 120px 120px 120px 100px 120px 80px;padding:12px 20px;background:rgba(0,0,0,0.3);border-bottom:1px solid var(--border);font-size:0.62rem;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);}
.table-row{display:grid;grid-template-columns:120px 100px 120px 120px 120px 100px 120px 80px;padding:14px 20px;border-bottom:1px solid var(--border);font-size:0.8rem;align-items:center;transition:background 0.2s;cursor:pointer;}
.table-row:hover{background:rgba(255,255,255,0.02);}
.table-row:last-child{border-bottom:none;}
.badge{padding:3px 10px;border-radius:3px;font-size:0.6rem;font-weight:700;letter-spacing:1px;display:inline-block;}
.badge-buy{background:rgba(0,255,136,0.12);color:var(--green);}
.badge-tp{background:rgba(0,255,136,0.08);color:var(--green);border:1px solid rgba(0,255,136,0.2);}
.badge-sl{background:rgba(255,51,102,0.12);color:var(--red);}
.td-price{font-family:'JetBrains Mono',monospace;font-size:0.78rem;}
.td-pnl{font-family:'JetBrains Mono',monospace;font-size:0.82rem;font-weight:700;}
.td-time{font-size:0.7rem;color:var(--text-dim);}
.td-pair{font-family:'JetBrains Mono',monospace;font-size:0.82rem;font-weight:700;color:var(--text-bright);}

/* PAGINATION */
.pagination{display:flex;justify-content:center;gap:8px;padding:20px;}
.page-btn{width:32px;height:32px;border-radius:4px;border:1px solid var(--border2);background:transparent;color:var(--text-dim);cursor:pointer;font-size:0.8rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.page-btn:hover,.page-btn.active{border-color:var(--green);color:var(--green);}

/* CHART MINI */
.pnl-chart{height:80px;background:var(--panel);border:1px solid var(--border2);border-radius:8px;display:flex;align-items:flex-end;gap:2px;padding:10px;margin-bottom:20px;overflow:hidden;}
.pnl-bar{flex:1;border-radius:2px 2px 0 0;min-height:3px;}
.bar-pos{background:var(--green);opacity:0.7;}
.bar-neg{background:var(--red);opacity:0.7;}

@media(max-width:1200px){.table-header,.table-row{grid-template-columns:100px 90px 110px 110px 100px 90px 100px 70px;font-size:0.72rem;}}
@media(max-width:768px){.main{margin-left:0;}.summary-row{grid-template-columns:repeat(3,1fr);}.table-header,.table-row{grid-template-columns:80px 80px 1fr 80px;}.table-header :not(:nth-child(1)):not(:nth-child(2)):not(:nth-child(5)):not(:nth-child(8)){display:none;}.table-row :not(:nth-child(1)):not(:nth-child(2)):not(:nth-child(5)):not(:nth-child(8)){display:none;}}

.nav-locked{position:relative;}
.nav-lock{margin-left:auto;font-size:0.7rem;opacity:0.6;}
.nav-locked.unlocked .nav-lock{display:none;}

/* Upgrade popup */
#upgrade-popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;}
#upgrade-popup.show{display:flex;}
.upgrade-modal{background:#0a0f16;border:1px solid rgba(0,255,136,0.2);border-radius:12px;padding:32px 24px;text-align:center;max-width:300px;width:90%;}
.upgrade-modal h3{color:#fff;font-size:1.1rem;margin-bottom:8px;}
.upgrade-modal p{color:#445566;font-size:0.85rem;margin-bottom:20px;line-height:1.6;}
.upgrade-modal-btn{background:#00ff88;color:#000;border:none;padding:12px 24px;border-radius:8px;font-weight:700;cursor:pointer;width:100%;font-size:0.9rem;margin-bottom:10px;}
.upgrade-modal-close{color:#334455;font-size:0.8rem;cursor:pointer;background:none;border:none;}
</style>

<script>
const trades = [];

let filtered = [...trades];

function updateFiltered(type='all') {
  filtered = type==='all' ? [...trades] : trades.filter(t=>t.action===type);
}

function filterTrades(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtered = type === 'all' ? [...trades] : trades.filter(t => t.action === type);
  renderTrades();
}

function renderTrades() {
  const body = document.getElementById('trades-body');
  if(!filtered.length) {
    body.innerHTML = '<div style="text-align:center;padding:32px;color:var(--text-dim);font-size:0.82rem">Tidak ada data trade</div>';
    return;
  }
  body.innerHTML = filtered.map(t => {
    const badgeClass = t.action==='BUY' ? 'badge-buy' : t.action==='SELL_TP' ? 'badge-tp' : 'badge-sl';
    const badgeText = t.action==='BUY' ? 'BUY' : t.action==='SELL_TP' ? 'SELL TP' : 'SELL SL';
    const pnlNum = parseFloat((t.pnl||'0').replace('$','').replace('+',''));
    const pnlText = t.pnl ? `<span style="color:${pnlNum>=0?'var(--green)':'var(--red)'}">${pnlNum>=0?'+':''}${t.pnl}</span>` : '<span style="color:var(--text-dim)">—</span>';
    const statusColor = t.status==='WIN' ? 'var(--green)' : t.status==='LOSS' ? 'var(--red)' : 'var(--text-dim)';
    return `
    <div class="table-row">
      <div class="td-time">${t.time}</div>
      <div><span class="badge ${badgeClass}">${badgeText}</span></div>
      <div class="td-pair">${t.pair}</div>
      <div class="td-price">${t.entry}</div>
      <div class="td-price">${t.exit || '—'}</div>
      <div class="td-price">${t.qty}</div>
      <div class="td-pnl">${pnlText}</div>
      <div style="font-size:0.7rem;color:${statusColor};font-weight:700">${t.status}</div>
    </div>`;
  }).join('');
}

function exportCSV() {
  const rows = [['Waktu','Aksi','Pair','Entry','Exit','Qty','PnL','Status']];
  trades.forEach(t => rows.push([t.time,t.action,t.pair,t.entry,t.exit||'',t.qty,t.pnl||'',t.status]));
  const csv = rows.map(r => r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download = 'nexus_trade_history.csv';
  a.click();
}

// PnL Chart
function renderChart() {
  const data = [0,0,0,0,0,0,0.1128,0,0,0,0,0,0.0487,0];
  const max = Math.max(...data);
  const chart = document.getElementById('pnl-chart');
  chart.innerHTML = data.map(v => `<div class="pnl-bar ${v>=0?'bar-pos':'bar-neg'}" style="height:${v===0?8:Math.max((v/max)*100,8)}%"></div>`).join('');
}

renderTrades();
renderChart();
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,getDoc,collection,query,where,orderBy,limit,getDocs}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyAmfMQnx-ZkP1e0BkD68d3lvIY5FFv8Rck",authDomain:"nexus-trade-e449e.firebaseapp.com",projectId:"nexus-trade-e449e"});
const auth=getAuth(app);
const db=getFirestore(app);

onAuthStateChanged(auth,async(u)=>{
  if(!u){window.location.replace('login.html');return;}
  
  // Load user info
  try{
    const snap=await getDoc(doc(db,'users',u.uid));
    if(snap.exists()){
      const d=snap.data();
      const nm=document.getElementById('sidebar-user-name');
      const pl=document.getElementById('sidebar-user-plan');
      if(nm) nm.textContent=d.name||u.displayName||u.email.split('@')[0];
      if(pl) pl.textContent='✦ '+(d.plan||'trial').toUpperCase();
    }
  }catch(e){}

  // Load trades
  try{
    const q=query(collection(db,'trades'),where('uid','==',u.uid),orderBy('timestamp','desc'),limit(100));
    const tSnap=await getDocs(q);
    tSnap.forEach(d=>{
      const t=d.data();
      const pnl=parseFloat(t.pnlUsdt||0);
      const pnlPct=parseFloat(t.pnlPct||0);
      trades.push({
        time:t.timestamp?new Date(t.timestamp).toLocaleString('id-ID'):'--',
        action:pnl>=0?'WIN':'LOSS',
        pair:t.symbol||'BTCUSDT',
        entry:'$'+parseFloat(t.entryPrice||0).toLocaleString('en',{minimumFractionDigits:2}),
        exit:'$'+parseFloat(t.exitPrice||0).toLocaleString('en',{minimumFractionDigits:2}),
        qty:t.quantity||0,
        pnl:(pnl>=0?'+':'')+'$'+pnl.toFixed(4),
        pnlPct:(pnlPct>=0?'+':'')+pnlPct.toFixed(2)+'%',
        status:t.status||'CLOSED'
      });
    });
    
    const wins=trades.filter(t=>t.action==='WIN').length;
    const losses=trades.filter(t=>t.action==='LOSS').length;
    const totalPnl=trades.reduce((s,t)=>s+parseFloat(t.pnl.replace('$','').replace('+','')),0);
    const wr=trades.length>0?(wins/trades.length*100).toFixed(0):0;
    const els=document.querySelectorAll('.sum-value');
    if(els[0]) els[0].textContent=trades.length;
    if(els[1]) els[1].textContent=wins;
    if(els[2]) els[2].textContent=losses;
    if(els[3]) els[3].textContent=wr+'%';
    if(els[4]) els[4].textContent=(totalPnl>=0?'+':'')+'$'+totalPnl.toFixed(4);
    filtered = [...trades];
    renderTrades();
  }catch(e){console.error('Trades error:',e);filtered=[...trades];renderTrades();}

  // Logout
  window.logoutUser=async()=>{
    window._loggingOut=true;
    await signOut(auth);
    window.location.href='login.html';
  };
});
</script>
